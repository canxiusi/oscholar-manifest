apiVersion: v1
kind: ConfigMap
metadata:
  name: oscholar-web-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /arxiv-pdf/ {
            proxy_pass https://arxiv.org/pdf/;
            proxy_set_header Host arxiv.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept "application/pdf";
            proxy_set_header User-Agent "Mozilla/5.0 (compatible; oscholar-proxy)";
            proxy_ssl_server_name on;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        location /api/ {
            proxy_pass http://dev-oscholar-gateway-service/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
    }
