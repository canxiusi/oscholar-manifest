name: Publish Library

on:
  workflow_dispatch:
    inputs:
      library:
        description: '要发布的库'
        required: true
        type: choice
        options:
          - oscholar-common
          - oscholar-paper-api
          - oscholar-social-api
          - oscholar-user-api
          - publish-all
      branch:
        description: '分支'
        required: true
        default: 'main'
        type: string

jobs:
  publish_single:
    if: inputs.library != 'publish-all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Determine repo and module
        id: info
        run: |
          case "${{ inputs.library }}" in
            oscholar-common)
              echo "repo=oscholar-common" >> $GITHUB_OUTPUT
              echo "module=" >> $GITHUB_OUTPUT
              ;;
            oscholar-paper-api)
              echo "repo=oscholar-paper" >> $GITHUB_OUTPUT
              echo "module=-pl oscholar-paper-api -am" >> $GITHUB_OUTPUT
              ;;
            oscholar-social-api)
              echo "repo=oscholar-social" >> $GITHUB_OUTPUT
              echo "module=-pl oscholar-social-api -am" >> $GITHUB_OUTPUT
              ;;
            oscholar-user-api)
              echo "repo=oscholar-user" >> $GITHUB_OUTPUT
              echo "module=-pl oscholar-user-api -am" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: canxiusi/${{ steps.info.outputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Delete existing package and deploy
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Create settings.xml
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PAT_TOKEN }}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/canxiusi/oscholar-common</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>
          </settings>
          EOF

          # Delete entire package (not just versions) to avoid 409
          delete_package() {
            local pkg_name=$1
            echo "=== Deleting package: ${pkg_name} ==="
            gh api --method DELETE "/users/canxiusi/packages/maven/${pkg_name}" 2>&1 || echo "Package ${pkg_name} not found or already deleted"
          }

          # Always delete first, then deploy
          echo "=== Cleaning existing packages ==="
          delete_package "com.oscholar.${{ inputs.library }}"

          echo "=== Deploying ==="
          mvn deploy -s settings.xml ${{ steps.info.outputs.module }} -DskipTests -B

  publish_all:
    if: inputs.library == 'publish-all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Maven settings
        run: |
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PAT_TOKEN }}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/canxiusi/oscholar-common</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Delete all existing packages
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          delete_package() {
            local pkg=$1
            echo "Deleting package: $pkg"
            gh api --method DELETE "/users/canxiusi/packages/maven/${pkg}" 2>&1 || echo "  -> not found or already deleted"
          }
          delete_package "com.oscholar.oscholar-common"
          delete_package "com.oscholar.oscholar-paper-api"
          delete_package "com.oscholar.oscholar-social-api"
          delete_package "com.oscholar.oscholar-user-api"

      - name: Checkout oscholar-common
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-common
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: common-code

      - name: Deploy oscholar-common
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cd common-code
          mvn deploy -s ../settings.xml -DskipTests -B

      - name: Checkout oscholar-paper
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-paper
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: paper-code

      - name: Deploy oscholar-paper-api
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cd paper-code
          mvn deploy -s ../settings.xml -pl oscholar-paper-api -am -DskipTests -B

      - name: Checkout oscholar-social
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-social
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: social-code

      - name: Deploy oscholar-social-api
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cd social-code
          mvn deploy -s ../settings.xml -pl oscholar-social-api -am -DskipTests -B

      - name: Checkout oscholar-user
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-user
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: user-code

      - name: Deploy oscholar-user-api
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cd user-code
          mvn deploy -s ../settings.xml -pl oscholar-user-api -am -DskipTests -B
