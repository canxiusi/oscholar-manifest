name: Publish Library

on:
  workflow_dispatch:
    inputs:
      library:
        description: '要发布的库'
        required: true
        type: choice
        options:
          - oscholar-common
          - oscholar-paper-api
          - oscholar-social-api
          - oscholar-user-api
          - publish-all
      branch:
        description: '分支'
        required: true
        default: 'main'
        type: string

jobs:
  publish_single:
    if: inputs.library != 'publish-all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Determine repo and module
        id: info
        run: |
          case "${{ inputs.library }}" in
            oscholar-common)
              echo "repo=oscholar-common" >> $GITHUB_OUTPUT
              echo "module=" >> $GITHUB_OUTPUT
              echo "artifact=com.oscholar.oscholar-common" >> $GITHUB_OUTPUT
              ;;
            oscholar-paper-api)
              echo "repo=oscholar-paper" >> $GITHUB_OUTPUT
              echo "module=-pl oscholar-paper-api -am" >> $GITHUB_OUTPUT
              echo "artifact=com.oscholar.oscholar-paper-api" >> $GITHUB_OUTPUT
              ;;
            oscholar-social-api)
              echo "repo=oscholar-social" >> $GITHUB_OUTPUT
              echo "module=-pl oscholar-social-api -am" >> $GITHUB_OUTPUT
              echo "artifact=com.oscholar.oscholar-social-api" >> $GITHUB_OUTPUT
              ;;
            oscholar-user-api)
              echo "repo=oscholar-user" >> $GITHUB_OUTPUT
              echo "module=-pl oscholar-user-api -am" >> $GITHUB_OUTPUT
              echo "artifact=com.oscholar.oscholar-user-api" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: canxiusi/${{ steps.info.outputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: List all Maven packages (diagnostic)
        run: |
          echo "=== Listing all Maven packages for canxiusi ==="
          curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/users/canxiusi/packages?package_type=maven" | jq -r '.[].name'

      - name: Delete existing package version
        run: |
          REPO="${{ steps.info.outputs.repo }}"
          ARTIFACT="${{ steps.info.outputs.artifact }}"

          delete_pkg() {
            local pkg_name=$1
            echo "--- Trying to delete package: ${pkg_name} ---"
            RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              "https://api.github.com/users/canxiusi/packages/maven/${pkg_name}/versions")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "HTTP status: $HTTP_CODE"
            echo "Response body: $BODY"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Package ${pkg_name} not found (HTTP $HTTP_CODE), skipping."
              return 0
            fi
            echo "$BODY" | jq -r '.[].id' | while read -r VID; do
              if [ -n "$VID" ] && [ "$VID" != "null" ]; then
                echo "Deleting version id: $VID"
                DEL_RESP=$(curl -s -w "\n%{http_code}" -X DELETE -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
                  "https://api.github.com/users/canxiusi/packages/maven/${pkg_name}/versions/$VID")
                echo "Delete response: $DEL_RESP"
              fi
            done
          }

          echo "=== Trying with groupId.artifactId format ==="
          delete_pkg "${ARTIFACT}"

          echo "=== Trying with just artifactId format ==="
          delete_pkg "${{ inputs.library }}"

      - name: Publish to GitHub Packages
        run: |
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PAT_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn deploy -s settings.xml ${{ steps.info.outputs.module }} -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

  publish_all:
    if: inputs.library == 'publish-all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Maven settings
        run: |
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PAT_TOKEN }}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/canxiusi/oscholar-common</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Checkout oscholar-common
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-common
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: common-code

      - name: List all Maven packages (diagnostic)
        run: |
          echo "=== Listing all Maven packages for canxiusi ==="
          curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/users/canxiusi/packages?package_type=maven" | jq '.[].name'

      - name: Delete existing oscholar-common versions
        run: |
          delete_all_versions() {
            local pkg_name=$1
            echo "--- Trying package: ${pkg_name} ---"
            RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              "https://api.github.com/users/canxiusi/packages/maven/${pkg_name}/versions")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "HTTP status: $HTTP_CODE"
            echo "Response: $BODY"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Not found (HTTP $HTTP_CODE), skipping."
              return 0
            fi
            echo "$BODY" | jq -r '.[].id' | while read -r VID; do
              if [ -n "$VID" ] && [ "$VID" != "null" ]; then
                echo "Deleting version id: $VID"
                DEL_RESP=$(curl -s -w "\n%{http_code}" -X DELETE -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
                  "https://api.github.com/users/canxiusi/packages/maven/${pkg_name}/versions/${VID}")
                echo "Delete response: $DEL_RESP"
              fi
            done
          }
          delete_all_versions "com.oscholar.oscholar-common"
          delete_all_versions "oscholar-common"

      - name: Deploy oscholar-common
        run: |
          cd common-code
          mvn deploy -s ../settings.xml -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Checkout oscholar-paper
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-paper
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: paper-code

      - name: Delete existing oscholar-paper-api versions
        run: |
          delete_all_versions() {
            local pkg_name=$1
            echo "--- Trying package: ${pkg_name} ---"
            RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              "https://api.github.com/users/canxiusi/packages/maven/${pkg_name}/versions")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "HTTP status: $HTTP_CODE"
            echo "Response: $BODY"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Not found (HTTP $HTTP_CODE), skipping."
              return 0
            fi
            echo "$BODY" | jq -r '.[].id' | while read -r VID; do
              if [ -n "$VID" ] && [ "$VID" != "null" ]; then
                echo "Deleting version id: $VID"
                DEL_RESP=$(curl -s -w "\n%{http_code}" -X DELETE -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
                  "https://api.github.com/users/canxiusi/packages/maven/${pkg_name}/versions/${VID}")
                echo "Delete response: $DEL_RESP"
              fi
            done
          }
          delete_all_versions "com.oscholar.oscholar-paper-api"
          delete_all_versions "oscholar-paper-api"

      - name: Deploy oscholar-paper-api
        run: |
          cd paper-code
          mvn deploy -s ../settings.xml -pl oscholar-paper-api -am -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Checkout oscholar-social
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-social
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: social-code

      - name: Delete existing oscholar-social-api versions
        run: |
          delete_all_versions() {
            local pkg_name=$1
            echo "--- Trying package: ${pkg_name} ---"
            RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              "https://api.github.com/users/canxiusi/packages/maven/${pkg_name}/versions")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "HTTP status: $HTTP_CODE"
            echo "Response: $BODY"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Not found (HTTP $HTTP_CODE), skipping."
              return 0
            fi
            echo "$BODY" | jq -r '.[].id' | while read -r VID; do
              if [ -n "$VID" ] && [ "$VID" != "null" ]; then
                echo "Deleting version id: $VID"
                DEL_RESP=$(curl -s -w "\n%{http_code}" -X DELETE -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
                  "https://api.github.com/users/canxiusi/packages/maven/${pkg_name}/versions/${VID}")
                echo "Delete response: $DEL_RESP"
              fi
            done
          }
          delete_all_versions "com.oscholar.oscholar-social-api"
          delete_all_versions "oscholar-social-api"

      - name: Deploy oscholar-social-api
        run: |
          cd social-code
          mvn deploy -s ../settings.xml -pl oscholar-social-api -am -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Checkout oscholar-user
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-user
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: user-code

      - name: Delete existing oscholar-user-api versions
        run: |
          delete_all_versions() {
            local pkg_name=$1
            echo "--- Trying package: ${pkg_name} ---"
            RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              "https://api.github.com/users/canxiusi/packages/maven/${pkg_name}/versions")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "HTTP status: $HTTP_CODE"
            echo "Response: $BODY"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Not found (HTTP $HTTP_CODE), skipping."
              return 0
            fi
            echo "$BODY" | jq -r '.[].id' | while read -r VID; do
              if [ -n "$VID" ] && [ "$VID" != "null" ]; then
                echo "Deleting version id: $VID"
                DEL_RESP=$(curl -s -w "\n%{http_code}" -X DELETE -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
                  "https://api.github.com/users/canxiusi/packages/maven/${pkg_name}/versions/${VID}")
                echo "Delete response: $DEL_RESP"
              fi
            done
          }
          delete_all_versions "com.oscholar.oscholar-user-api"
          delete_all_versions "oscholar-user-api"

      - name: Deploy oscholar-user-api
        run: |
          cd user-code
          mvn deploy -s ../settings.xml -pl oscholar-user-api -am -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
