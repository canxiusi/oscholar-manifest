name: Publish Library

on:
  workflow_dispatch:
    inputs:
      library:
        description: '要发布的库'
        required: true
        type: choice
        options:
          - oscholar-common
          - oscholar-paper-api
          - oscholar-social-api
          - oscholar-user-api
          - publish-all
      branch:
        description: '分支'
        required: true
        default: 'main'
        type: string

jobs:
  publish_single:
    if: inputs.library != 'publish-all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Determine repo and module
        id: info
        run: |
          case "${{ inputs.library }}" in
            oscholar-common)
              echo "repo=oscholar-common" >> $GITHUB_OUTPUT
              echo "module=" >> $GITHUB_OUTPUT
              echo "artifact=com.oscholar.oscholar-common" >> $GITHUB_OUTPUT
              ;;
            oscholar-paper-api)
              echo "repo=oscholar-paper" >> $GITHUB_OUTPUT
              echo "module=-pl oscholar-paper-api -am" >> $GITHUB_OUTPUT
              echo "artifact=com.oscholar.oscholar-paper-api" >> $GITHUB_OUTPUT
              ;;
            oscholar-social-api)
              echo "repo=oscholar-social" >> $GITHUB_OUTPUT
              echo "module=-pl oscholar-social-api -am" >> $GITHUB_OUTPUT
              echo "artifact=com.oscholar.oscholar-social-api" >> $GITHUB_OUTPUT
              ;;
            oscholar-user-api)
              echo "repo=oscholar-user" >> $GITHUB_OUTPUT
              echo "module=-pl oscholar-user-api -am" >> $GITHUB_OUTPUT
              echo "artifact=com.oscholar.oscholar-user-api" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: canxiusi/${{ steps.info.outputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Delete existing package version
        run: |
          ARTIFACT="${{ steps.info.outputs.artifact }}"
          VERSION_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/users/canxiusi/packages/maven/${ARTIFACT}/versions" \
            | jq -r '.[] | select(.name=="1.0.0") | .id')
          if [ -n "$VERSION_ID" ] && [ "$VERSION_ID" != "null" ]; then
            echo "Deleting ${ARTIFACT}:1.0.0 (id: $VERSION_ID)"
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              "https://api.github.com/users/canxiusi/packages/maven/${ARTIFACT}/versions/$VERSION_ID"
          else
            echo "${ARTIFACT}:1.0.0 not found, skipping delete."
          fi

      - name: Publish to GitHub Packages
        run: |
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PAT_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn deploy -s settings.xml ${{ steps.info.outputs.module }} -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

  publish_all:
    if: inputs.library == 'publish-all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Maven settings
        run: |
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PAT_TOKEN }}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/canxiusi/oscholar-common</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Checkout oscholar-common
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-common
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: common-code

      - name: Delete existing oscholar-common
        run: |
          VERSION_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/users/canxiusi/packages/maven/com.oscholar.oscholar-common/versions" \
            | jq -r '.[] | select(.name=="1.0.0") | .id')
          if [ -n "$VERSION_ID" ] && [ "$VERSION_ID" != "null" ]; then
            echo "Deleting oscholar-common:1.0.0 (id: $VERSION_ID)"
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              "https://api.github.com/users/canxiusi/packages/maven/com.oscholar.oscholar-common/versions/$VERSION_ID"
          else
            echo "oscholar-common:1.0.0 not found, skipping delete."
          fi

      - name: Deploy oscholar-common
        run: |
          cd common-code
          mvn deploy -s ../settings.xml -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Checkout oscholar-paper
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-paper
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: paper-code

      - name: Delete existing oscholar-paper-api
        run: |
          VERSION_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/users/canxiusi/packages/maven/com.oscholar.oscholar-paper-api/versions" \
            | jq -r '.[] | select(.name=="1.0.0") | .id')
          if [ -n "$VERSION_ID" ] && [ "$VERSION_ID" != "null" ]; then
            echo "Deleting oscholar-paper-api:1.0.0 (id: $VERSION_ID)"
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              "https://api.github.com/users/canxiusi/packages/maven/com.oscholar.oscholar-paper-api/versions/$VERSION_ID"
          else
            echo "oscholar-paper-api:1.0.0 not found, skipping delete."
          fi

      - name: Deploy oscholar-paper-api
        run: |
          cd paper-code
          mvn deploy -s ../settings.xml -pl oscholar-paper-api -am -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Checkout oscholar-social
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-social
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: social-code

      - name: Delete existing oscholar-social-api
        run: |
          VERSION_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/users/canxiusi/packages/maven/com.oscholar.oscholar-social-api/versions" \
            | jq -r '.[] | select(.name=="1.0.0") | .id')
          if [ -n "$VERSION_ID" ] && [ "$VERSION_ID" != "null" ]; then
            echo "Deleting oscholar-social-api:1.0.0 (id: $VERSION_ID)"
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              "https://api.github.com/users/canxiusi/packages/maven/com.oscholar.oscholar-social-api/versions/$VERSION_ID"
          else
            echo "oscholar-social-api:1.0.0 not found, skipping delete."
          fi

      - name: Deploy oscholar-social-api
        run: |
          cd social-code
          mvn deploy -s ../settings.xml -pl oscholar-social-api -am -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Checkout oscholar-user
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-user
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: user-code

      - name: Delete existing oscholar-user-api
        run: |
          VERSION_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/users/canxiusi/packages/maven/com.oscholar.oscholar-user-api/versions" \
            | jq -r '.[] | select(.name=="1.0.0") | .id')
          if [ -n "$VERSION_ID" ] && [ "$VERSION_ID" != "null" ]; then
            echo "Deleting oscholar-user-api:1.0.0 (id: $VERSION_ID)"
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              "https://api.github.com/users/canxiusi/packages/maven/com.oscholar.oscholar-user-api/versions/$VERSION_ID"
          else
            echo "oscholar-user-api:1.0.0 not found, skipping delete."
          fi

      - name: Deploy oscholar-user-api
        run: |
          cd user-code
          mvn deploy -s ../settings.xml -pl oscholar-user-api -am -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
