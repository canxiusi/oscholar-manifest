name: Publish Library

on:
  workflow_dispatch:
    inputs:
      library:
        description: '要发布的库'
        required: true
        type: choice
        options:
          - oscholar-common
          - oscholar-paper-api
          - oscholar-social-api
          - oscholar-user-api
          - publish-all
      branch:
        description: '分支'
        required: true
        default: 'main'
        type: string

jobs:
  publish_single:
    if: inputs.library != 'publish-all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Determine repo and module
        id: info
        run: |
          case "${{ inputs.library }}" in
            oscholar-common)
              echo "repo=oscholar-common" >> $GITHUB_OUTPUT
              echo "module=" >> $GITHUB_OUTPUT
              ;;
            oscholar-paper-api)
              echo "repo=oscholar-paper" >> $GITHUB_OUTPUT
              echo "module=-pl oscholar-paper-api -am" >> $GITHUB_OUTPUT
              ;;
            oscholar-social-api)
              echo "repo=oscholar-social" >> $GITHUB_OUTPUT
              echo "module=-pl oscholar-social-api -am" >> $GITHUB_OUTPUT
              ;;
            oscholar-user-api)
              echo "repo=oscholar-user" >> $GITHUB_OUTPUT
              echo "module=-pl oscholar-user-api -am" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: canxiusi/${{ steps.info.outputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Delete and deploy
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Create settings.xml
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PAT_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

          # Function to delete all versions of a package using gh CLI
          delete_package() {
            local pkg_name=$1
            echo "=== Attempting to delete package: ${pkg_name} ==="
            # List versions
            VERSIONS=$(gh api "/users/canxiusi/packages/maven/${pkg_name}/versions" --jq '.[].id' 2>&1) || true
            if echo "$VERSIONS" | grep -q "Not Found\|404\|Package not found"; then
              echo "Package ${pkg_name} not found, skipping."
              return 0
            fi
            echo "Found versions: $VERSIONS"
            for VID in $VERSIONS; do
              if [ -n "$VID" ] && [ "$VID" != "null" ]; then
                echo "Deleting version $VID..."
                gh api --method DELETE "/users/canxiusi/packages/maven/${pkg_name}/versions/${VID}" 2>&1 || true
              fi
            done
          }

          # List all packages first (diagnostic)
          echo "=== All Maven packages ==="
          gh api "/users/canxiusi/packages?package_type=maven" --jq '.[].name' 2>&1 || echo "Failed to list packages"

          # Try to deploy
          echo "=== First deploy attempt ==="
          if mvn deploy -s settings.xml ${{ steps.info.outputs.module }} -DskipTests -B 2>&1; then
            echo "Deploy succeeded on first attempt!"
            exit 0
          fi

          echo "=== Deploy failed (likely 409), deleting existing versions ==="
          # Try multiple package name formats
          delete_package "com.oscholar.oscholar-common"
          delete_package "oscholar-common"
          delete_package "com.oscholar.oscholar-paper-api"
          delete_package "oscholar-paper-api"
          delete_package "com.oscholar.oscholar-social-api"
          delete_package "oscholar-social-api"
          delete_package "com.oscholar.oscholar-user-api"
          delete_package "oscholar-user-api"

          echo "=== Retry deploy ==="
          mvn deploy -s settings.xml ${{ steps.info.outputs.module }} -DskipTests -B

  publish_all:
    if: inputs.library == 'publish-all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Maven settings
        run: |
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PAT_TOKEN }}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/canxiusi/oscholar-common</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: List all packages (diagnostic)
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "=== All Maven packages for canxiusi ==="
          gh api "/users/canxiusi/packages?package_type=maven" --jq '.[].name' || echo "Failed to list"

      - name: Checkout oscholar-common
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-common
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: common-code

      - name: Deploy oscholar-common
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          delete_package() {
            local pkg=$1
            echo "Deleting package: $pkg"
            for VID in $(gh api "/users/canxiusi/packages/maven/${pkg}/versions" --jq '.[].id' 2>/dev/null); do
              gh api --method DELETE "/users/canxiusi/packages/maven/${pkg}/versions/${VID}" 2>&1 || true
            done
          }
          cd common-code
          if ! mvn deploy -s ../settings.xml -DskipTests -B 2>&1; then
            echo "=== 409 conflict, deleting and retrying ==="
            delete_package "com.oscholar.oscholar-common"
            delete_package "oscholar-common"
            mvn deploy -s ../settings.xml -DskipTests -B
          fi

      - name: Checkout oscholar-paper
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-paper
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: paper-code

      - name: Deploy oscholar-paper-api
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          delete_package() {
            local pkg=$1
            echo "Deleting package: $pkg"
            for VID in $(gh api "/users/canxiusi/packages/maven/${pkg}/versions" --jq '.[].id' 2>/dev/null); do
              gh api --method DELETE "/users/canxiusi/packages/maven/${pkg}/versions/${VID}" 2>&1 || true
            done
          }
          cd paper-code
          if ! mvn deploy -s ../settings.xml -pl oscholar-paper-api -am -DskipTests -B 2>&1; then
            echo "=== 409 conflict, deleting and retrying ==="
            delete_package "com.oscholar.oscholar-paper-api"
            delete_package "oscholar-paper-api"
            mvn deploy -s ../settings.xml -pl oscholar-paper-api -am -DskipTests -B
          fi

      - name: Checkout oscholar-social
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-social
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: social-code

      - name: Deploy oscholar-social-api
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          delete_package() {
            local pkg=$1
            echo "Deleting package: $pkg"
            for VID in $(gh api "/users/canxiusi/packages/maven/${pkg}/versions" --jq '.[].id' 2>/dev/null); do
              gh api --method DELETE "/users/canxiusi/packages/maven/${pkg}/versions/${VID}" 2>&1 || true
            done
          }
          cd social-code
          if ! mvn deploy -s ../settings.xml -pl oscholar-social-api -am -DskipTests -B 2>&1; then
            echo "=== 409 conflict, deleting and retrying ==="
            delete_package "com.oscholar.oscholar-social-api"
            delete_package "oscholar-social-api"
            mvn deploy -s ../settings.xml -pl oscholar-social-api -am -DskipTests -B
          fi

      - name: Checkout oscholar-user
        uses: actions/checkout@v4
        with:
          repository: canxiusi/oscholar-user
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: user-code

      - name: Deploy oscholar-user-api
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          delete_package() {
            local pkg=$1
            echo "Deleting package: $pkg"
            for VID in $(gh api "/users/canxiusi/packages/maven/${pkg}/versions" --jq '.[].id' 2>/dev/null); do
              gh api --method DELETE "/users/canxiusi/packages/maven/${pkg}/versions/${VID}" 2>&1 || true
            done
          }
          cd user-code
          if ! mvn deploy -s ../settings.xml -pl oscholar-user-api -am -DskipTests -B 2>&1; then
            echo "=== 409 conflict, deleting and retrying ==="
            delete_package "com.oscholar.oscholar-user-api"
            delete_package "oscholar-user-api"
            mvn deploy -s ../settings.xml -pl oscholar-user-api -am -DskipTests -B
          fi
